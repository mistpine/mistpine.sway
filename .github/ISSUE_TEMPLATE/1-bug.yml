# Filing through the API or `gh issue create`? Forms only apply on the web:
# write the body with each field's label below as a `### ` heading, in order.
name: Wrong or broken colors
description: A color that differs from the spec, or sway, i3 or swaynag rejecting a file.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        mistpine.sway follows the [mistpine spec](https://github.com/mistpine/mistpine/blob/main/docs/spec.md).
        A color that differs from the spec is a bug here; a spec color you'd like
        changed belongs in [mistpine](https://github.com/mistpine/mistpine/issues/new/choose).
  - type: textarea
    id: what
    attributes:
      label: What's wrong
      description: What you see, where (a window title or frame, the bar, swaynag), and what you expected.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here.
  - type: textarea
    id: config
    attributes:
      label: Config
      description: "The lines of your sway or i3 config around the `include`, and any `client.*` or `bar` colors of your own."
      render: text
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: "`sway --version` or `i3 --version`, the distribution, and where the files came from (curl, a clone at some commit)."
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I'm using the latest `themes/` from main.
          required: true
        - label: "`sway -C` (or `i3 -C`) prints no errors for my config."
