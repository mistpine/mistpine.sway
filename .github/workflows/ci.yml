name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # themes/ and examples/ must match the generator and the current mistpine spec.
      - run: pnpm check
      # sway 1.9/1.11 and i3 4.23/4.25 (in Docker) must load the files and report the spec colors.
      - run: pnpm verify
