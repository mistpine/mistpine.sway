name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # themes/ and examples/ must match the generator and the current mistpine spec.
    # sway 1.9/1.11 and i3 4.23/4.25 (in Docker) must load the files and report the spec colors.
    uses: mistpine/port-kit/.github/workflows/port.yml@v0.1.0
    with:
      verify: true
